<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Predicción de Rendimiento Estudiantil</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <hr>
        <h2>Predicción en batch (CSV)</h2>
        <input type="file" id="csv-input" accept=".csv">
        <button id="batch-predict-btn" disabled>Predecir batch</button>
        <div id="batch-result"></div>
    <main>
        <h1>Predicción de Rendimiento Estudiantil</h1>
        <p id="model-info">Cargando información del modelo...</p>

        <form id="predict-form">
            <label>
                Género
                <select name="gender" required>
                    <option value="Female">Female</option>
                    <option value="Male">Male</option>
                </select>
            </label>

            <label>
                Horas de estudio (por semana)
                <input type="number" name="study_time_hours" step="0.1" min="0" required>
            </label>

            <label>
                Asistencia (%)
                <input type="number" name="attendance_percent" step="0.1" min="0" max="100" required>
            </label>

            <label>
                Horas de sueño (promedio diario)
                <input type="number" name="sleep_hours" step="0.1" min="0" required>
            </label>

            <label>
                Educación de los padres
                <select name="parental_education" required>
                    <option value="High School">High School</option>
                    <option value="Bachelors">Bachelors</option>
                    <option value="Masters">Masters</option>
                    <option value="PhD">PhD</option>
                    <option value="None">No especificado</option>
                </select>
            </label>

            <label>
                Acceso a internet
                <select name="internet_access" required>
                    <option value="Yes">Sí</option>
                    <option value="No">No</option>
                </select>
            </label>

            <label>
                Actividades extracurriculares
                <select name="extracurricular_activities" required>
                    <option value="Yes">Sí</option>
                    <option value="No">No</option>
                </select>
            </label>

            <label>
                Trabajo part-time
                <select name="part_time_job" required>
                    <option value="Yes">Sí</option>
                    <option value="No">No</option>
                </select>
            </label>

            <label>
                Nota anterior
                <input type="number" name="previous_grade" step="0.1" min="0" required>
            </label>

            <button type="submit">Predecir</button>
        </form>

        <div id="result"></div>
    </main>

    <script src="app.js"></script>
</body>
</html>
