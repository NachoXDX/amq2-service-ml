server {
    listen 80;
    server_name localhost;

    # 1. Serve static webpage
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Reverse proxy API traffic to FastAPI container
    # Requests to http://localhost/api/... get forwarded to http://fastapi:8800/...
    location /api/ {
        proxy_pass http://fastapi:8800/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy FastAPI Swagger Docs (/docs & /openapi.json)
    location /docs {
        proxy_pass http://fastapi:8800/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass http://fastapi:8800/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
